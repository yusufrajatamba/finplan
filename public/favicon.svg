<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bfiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B5DA7"/>
      <stop offset="100%" stop-color="#074580"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>
  
  <!-- Rounded Crest Container -->
  <rect x="8" y="8" width="112" height="112" rx="26" fill="url(#bfiGrad)"/>
  
  <!-- Subtle Inner Border -->
  <rect x="10" y="10" width="108" height="108" rx="24" fill="none" stroke="#ffffff" stroke-width="2" stroke-opacity="0.3"/>
  
  <!-- Monogram FP -->
  <text x="64" y="82" 
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" 
        font-size="64" 
        font-weight="900" 
        fill="#ffffff" 
        text-anchor="middle" 
        letter-spacing="-2">FP</text>
        
  <!-- Vibrant BFI Orange Growth Indicator Dot -->
  <circle cx="102" cy="30" r="10" fill="#E8701A" stroke="#ffffff" stroke-width="3"/>
</svg>
